name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: '25'

      - name: Build the theme agent
        run: sh agent/build.sh

      - name: Package the release zip (theme + installers + lib + agent jar)
        run: |
          tag="${GITHUB_REF_NAME}"
          stage="jd-highlighter-${tag}"
          mkdir -p "$stage/agent"
          cp -R theme install lib "$stage"/
          cp agent/jd-highlighter-agent.jar "$stage/agent"/
          cp README.md LICENSE "$stage"/
          zip -r "jd-highlighter-${tag}.zip" "$stage"
          echo "Packaged jd-highlighter-${tag}.zip:"
          unzip -l "jd-highlighter-${tag}.zip"

      - name: Publish the GitHub release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          name: ${{ github.ref_name }}
          body_path: .github/release-notes/${{ github.ref_name }}.md
          files: jd-highlighter-${{ github.ref_name }}.zip
          fail_on_unmatched_files: true
